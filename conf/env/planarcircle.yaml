name: planarcircle
args: []
kwargs: 
  with_velocity: true
  with_target: true

dataset:
  _target_: "datasets.planarcircle_dset.load_planarcircle_slice_train_val"
  with_velocity: true
  n_rollout: null
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR}/planarcircle/A_to_B
  split_ratio: 0.9
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 32
persistent_workers: true
pin_memory: true
